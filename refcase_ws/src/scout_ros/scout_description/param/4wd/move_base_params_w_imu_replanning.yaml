base_global_planner: global_planner/GlobalPlanner 
base_local_planner: dwa_local_planner/DWAPlannerROS

#base_local_planner: base_local_planner/TrajectoryPlannerROS
#base_global_planner: navfn/NavfnROS # global_planner/GlobalPlanner 

shutdown_costmaps: false


#recovery_behavior_enabled: false 
#clearing_rotation_allowed: false 

#Enable for test
recovery_behavior_enabled: true                                                                                                
clearing_rotation_allowed: true         

controller_frequency: 20
controller_patience: 5 # 2 seconds before abort if local planner fails

#planner_frequency: 0 # 0 = Global planner runs only when a new goal is received
#planner_patience: 0 # 0 = no retries, immediately abort if global planner fails
#max_planning_retries: 0 # Disable planning retries, if the first attempt to call (makePlan) returns empty, immediately aborts the goal
# recovery_behaviors: []

## Enable re-planning 

planner_frequency: 2.0                                                                                                                      
planner_patience: 5.0                                                                                                                         
max_planning_retries: 5

recovery_behaviors:
  - name: 'conservative_reset'
    type: 'clear_costmap_recovery/ClearCostmapRecovery'
  - name: 'rotate_recovery'
    type: 'rotate_recovery/RotateRecovery'
  - name: 'aggressive_reset'
    type: 'clear_costmap_recovery/ClearCostmapRecovery'

oscillation_timeout: 10.0 # give the robot enough time to reorient before considering it stuck
oscillation_distance: 0.2

conservative_reset_dist: 3.0

conservative_reset:
  reset_distance: 3.0   # clear costmap beyond 3m from robot

aggressive_reset:
  reset_distance: 0.0   # clear entire costmap

cost_factor: 0.55 #0.55 #1
neutral_cost: 55 #66 #55
lethal_cost: 253

NavfnROS:
  allow_unknown: false # Specifies whether or not to allow navfn to create plans that traverse unknown space.
  default_tolerance: 0.1 # A tolerance on the goal point for the planner.
  visualize_potential: true
  publish_potential: true
  planner_window_x: 0.0        # 0.0 = Use full map
  planner_window_y: 0.0

GlobalPlanner:
  allow_unknown: true
  default_tolerance: 0.1
  visualize_potential: true
  publish_potential: true
  use_dijkstra: true   # Dijkstra is strictly wavefront (BFS)
  use_quadratic: true         # Slightly smoother path following grid centers
  use_grid_path: false        # false = follow grid gradient (smoother), true = strictly follow grid centers
  old_navfn_behavior: false
  cost_power: 2.0
