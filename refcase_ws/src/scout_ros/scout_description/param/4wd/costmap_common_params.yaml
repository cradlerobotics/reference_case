obstacles_layer:
  observation_sources: laser_scan
  laser_scan:
    topic: /scan
    sensor_frame: laser_link
    data_type: LaserScan
    clearing: true
    marking: true
    min_obstacle_height: -2.0
    max_obstacle_height: 2.0
    obstacle_range: 2.0 #2.5
    raytrace_range: 3.0

inflation_layer:
  inflation_radius: 0.5
  cost_scaling_factor: 3.0  # Higher cost_scaling_factor = the planner avoids obstacles more aggressively.

 
 
