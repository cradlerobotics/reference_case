use_map_topic: true # false 
scan_topic: /scan # added by sky

odom_frame_id: "odom"
base_frame_id: "base_link" #"base_footprint"
global_frame_id: "map"

## Publish scans from best pose at a max of 10 Hz
odom_model_type: "diff"
odom_alpha5: 0.1
gui_publish_rate: 10.0
laser_max_beams: 120
laser_max_range: 12.0
min_particles: 2000
max_particles: 5000
kld_err: 0.05
kld_z: 0.99

odom_alpha1: 0.2  # rotation noise from rotation
odom_alpha2: 0.2  # rotation noise from translation ## translation std dev, m
odom_alpha3: 0.2  # translation noise from translation
odom_alpha4: 0.2  # translation noise from rotation


laser_z_hit: 0.9
laser_z_short: 0.05
laser_z_max: 0.05
laser_z_rand: 0.05
laser_sigma_hit: 0.1
laser_lambda_short: 0.1
laser_model_type: "likelihood_field" # "likelihood_field" or "beam"
laser_likelihood_max_dist: 2.0
update_min_d: 0.1
update_min_a: 0.1

resample_interval: 1

receive_map_topic: true # amcl will subscribe to the map topic rather than making a service call to received its map 

## Increase tolerance because the computer can get quite busy 
transform_tolerance: 0.5
recovery_alpha_slow: 0.001
recovery_alpha_fast: 0.2
