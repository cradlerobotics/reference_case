map_type: voxel

obstacle_range: 2.5
raytrace_range: 3.0
#max_obstacle_height: 2.0
#origin_z: 0.0
inflation_radius: 0.55
#  Use a circular footprint (for simple robots)
robot_radius: 0.22  # Adjust based on your robot size

z_resolution: 0.2
z_voxels: 10
unknown_threshold: 9
mark_threshold: 0

publish_voxel_map: true
transform_tolerance: 1.0
meter_scoring: true



footprint: [[-0.29,-0.27], [-0.29,0.27], # bottom_left - top_left
            [-0.07,0.27], [-0.07,0.2], # around top_left wheel
            [0.07,0.2], [0.07,0.27], [0.3,0.27], # around top_right wheel
            [0.3,-0.27], [0.07,-0.27], # around botom_right wheel
            [0.07,-0.2], [-0.07,-0.2], [-0.07,-0.27]] # around botom_left wheel
footprint_padding: 0.05


plugins:
  - {name: obstacles_layer, type: "costmap_2d::ObstacleLayer"}
  - {name: inflater_layer, type: "costmap_2d::InflationLayer"}
  - {name: static_layer, type: "costmap_2d::StaticLayer"}
# - {name: social_layer, type: "social_navigation_layers::ProxemicLayer"}


#obstacles_layer:
#  observation_sources: scan
#  scan: {sensor_frame: front_laser, data_type: LaserScan, topic: front/scan, marking: true, clearing: true, min_obstacle_height: -2.0, max_obstacle_height: 2.0, obstacle_range: 2.5, raytrace_range: 3.0}

obstacles_layer:
  observation_sources: laser_scan
  laser_scan:
    topic: /scan
    sensor_frame: laser_link
    data_type: LaserScan
    clearing: true
    marking: true
    min_obstacle_height: -2.0 
    max_obstacle_height: 2.0
    obstacle_range: 1.0 #2.5 
    raytrace_range: 3.0

inflation_layer:
 inflation_radius: 0.2 # 0.55
 cost_scaling_factor: 2.0
 lethal_cost_threshold: 50
 
